name: 🐛 버그 리포트
description: Synapse에서 발견한 버그 보고
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 버그 요약
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: 영향받는 서비스
      multiple: true
      options:
        - Platform Service
        - Learning Service
        - Knowledge Service
        - Engagement Service
        - AI Service
        - Frontend (Flutter)
        - Infrastructure (gitops)
        - Shared (Avro 스키마)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - 로컬 docker-compose
        - 로컬 K8s (kind/minikube)
        - 개발 클러스터 (ArgoCD)
        - 프로덕션
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그·트레이스 (Tempo trace ID 권장)
      render: shell
