name: ✨ 기능 제안
description: 새 기능 또는 개선 제안
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 사용자가 어떤 상황에서 무엇이 불편한가?
      placeholder: 예약 변경 시 환자가 처음부터 다시 입력해야 한다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해법
      description: 어떻게 해결하면 좋을지
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 검토했으나 채택하지 않은 다른 접근

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - High (현재 흐름이 막힘)
        - Medium (개선 가치 큼)
        - Low (있으면 좋음)
    validations:
      required: true
